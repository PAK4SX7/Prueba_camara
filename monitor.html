<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖥️ Monitor - Cámara de seguridad</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0a; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Courier New', monospace; flex-direction:column; }
        #videoContainer { position:relative; width:90%; max-width:800px; background:#000; border-radius:16px; overflow:hidden; border:3px solid #ff3333; box-shadow:0 0 50px rgba(255,0,0,0.3); }
        video { display:block; width:100%; height:auto; background:#111; transform:scaleX(-1); }
        #overlay { position:absolute; bottom:15px; left:15px; color:#0f0; font-size:14px; background:rgba(0,0,0,0.7); padding:6px 14px; border-radius:20px; border-left:3px solid #0f0; pointer-events:none; }
        #overlay .red-dot { display:inline-block; width:10px; height:10px; background:#ff0000; border-radius:50%; margin-right:8px; animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%{opacity:1;transform:scale(1);} 50%{opacity:0.3;transform:scale(0.8);} 100%{opacity:1;transform:scale(1);} }
        #statusBar { margin-top:20px; padding:10px 24px; background:#1a1a1a; border-radius:30px; color:#0f0; font-size:15px; border:1px solid #333; }
        #connectBtn { margin-top:15px; padding:12px 35px; background:#222; border:1px solid #555; color:#ddd; border-radius:30px; font-size:16px; cursor:pointer; transition:0.3s; font-weight:bold; }
        #connectBtn:hover { background:#333; border-color:#0f0; color:#0f0; }
        .info { margin-top:10px; color:#666; font-size:13px; }
        .error { color:#ff4444; }
    </style>
</head>
<body>
    <div id="videoContainer">
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="overlay">
            <span class="red-dot"></span> EN VIVO • <span id="timestamp"></span>
        </div>
    </div>
    <div id="statusBar">
        <span id="statusText">🔴 Desconectado</span>
    </div>
    <button id="connectBtn">🔗 Conectar a la cámara</button>
    <div class="info">ID de la cámara: <strong>camara-seguridad-2026</strong></div>

    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script>
        const remoteVideo = document.getElementById('remoteVideo');
        const statusText = document.getElementById('statusText');
        const connectBtn = document.getElementById('connectBtn');
        const timestampSpan = document.getElementById('timestamp');

        const CAMERA_ID = 'camara-seguridad-2026';
        let peer = null;
        let call = null;
        let retryCount = 0;
        const MAX_RETRIES = 3;
        let retryTimer = null;

        // Reloj en overlay
        function updateClock() {
            const now = new Date();
            timestampSpan.textContent = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function connectToCamera(manual = false) {
            if (retryTimer) {
                clearTimeout(retryTimer);
                retryTimer = null;
            }
            if (call && call.open) {
                // Si ya está conectado, desconectar
                disconnect();
                return;
            }

            if (peer) {
                peer.destroy();
                peer = null;
            }

            statusText.textContent = '🔄 Conectando al servidor...';
            connectBtn.disabled = true;
            connectBtn.textContent = '⏳ Conectando...';

            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            let callAttempted = false;

            peer.on('open', (id) => {
                console.log('Receptor abierto con ID:', id);
                statusText.textContent = '📡 Llamando a la cámara...';
                // Iniciar llamada
                call = peer.call(CAMERA_ID, undefined);
                if (call) {
                    callAttempted = true;
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        statusText.textContent = '✅ VIDEO EN VIVO';
                        document.getElementById('statusBar').style.borderColor = '#0f0';
                        connectBtn.textContent = '🔌 Desconectar';
                        connectBtn.disabled = false;
                        retryCount = 0; // resetear contador de reintentos
                        console.log('✅ Conectado exitosamente');
                    });
                    call.on('close', () => {
                        console.log('Llamada cerrada');
                        remoteVideo.srcObject = null;
                        statusText.textContent = '⏹️ Transmisión finalizada';
                        document.getElementById('statusBar').style.borderColor = '#ff3333';
                        connectBtn.textContent = '🔗 Conectar a la cámara';
                        connectBtn.disabled = false;
                        call = null;
                    });
                    call.on('error', (err) => {
                        console.error('Error en llamada:', err);
                        statusText.textContent = '❌ Error: ' + (err.message || err.type);
                        connectBtn.textContent = '🔗 Reintentar';
                        connectBtn.disabled = false;
                        call = null;
                        // Reintentar automáticamente si no fue manual
                        if (!manual && retryCount < MAX_RETRIES) {
                            retryCount++;
                            console.log(`Reintento ${retryCount}/${MAX_RETRIES} en 3s...`);
                            statusText.textContent = `🔄 Reintentando (${retryCount}/${MAX_RETRIES})...`;
                            retryTimer = setTimeout(() => connectToCamera(false), 3000);
                        }
                    });
                } else {
                    // No se pudo crear la llamada
                    statusText.textContent = '❌ No se pudo iniciar la llamada';
                    connectBtn.textContent = '🔗 Reintentar';
                    connectBtn.disabled = false;
                    if (!manual && retryCount < MAX_RETRIES) {
                        retryCount++;
                        console.log(`Reintento ${retryCount}/${MAX_RETRIES} en 3s...`);
                        statusText.textContent = `🔄 Reintentando (${retryCount}/${MAX_RETRIES})...`;
                        retryTimer = setTimeout(() => connectToCamera(false), 3000);
                    }
                }
            });

            peer.on('error', (err) => {
                console.error('Error PeerJS:', err);
                let msg = 'Error: ' + err.type;
                if (err.type === 'peer-unavailable') {
                    msg = '⚠️ La cámara no está activa. Asegúrate de abrir camara.html primero y permitir la cámara.';
                }
                statusText.textContent = msg;
                connectBtn.textContent = '🔗 Reintentar';
                connectBtn.disabled = false;
                if (!manual && retryCount < MAX_RETRIES) {
                    retryCount++;
                    console.log(`Reintento ${retryCount}/${MAX_RETRIES} en 3s...`);
                    statusText.textContent = `🔄 Reintentando (${retryCount}/${MAX_RETRIES})...`;
                    retryTimer = setTimeout(() => connectToCamera(false), 3000);
                }
            });
        }

        function disconnect() {
            if (call) {
                call.close();
                call = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            remoteVideo.srcObject = null;
            statusText.textContent = '🔴 Desconectado';
            connectBtn.textContent = '🔗 Conectar a la cámara';
            document.getElementById('statusBar').style.borderColor = '#ff3333';
            if (retryTimer) {
                clearTimeout(retryTimer);
                retryTimer = null;
            }
            retryCount = 0;
        }

        // Botón conectar/desconectar
        connectBtn.addEventListener('click', function() {
            if (call && call.open) {
                disconnect();
            } else {
                // Reiniciar contador de reintentos y conectar manualmente
                retryCount = 0;
                if (retryTimer) {
                    clearTimeout(retryTimer);
                    retryTimer = null;
                }
                connectToCamera(true); // manual
            }
        });

        // Opcional: intentar conexión automática al cargar (descomenta si quieres)
        // setTimeout(() => connectToCamera(true), 1000);
    </script>
</body>
</html>
